<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deploy · GOcontroll</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="/pub/favicon-light.png">
<link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="/pub/favicon-dark.png">
<link rel="apple-touch-icon" href="/pub/favicon-large.png">
<link rel="stylesheet" href="/styles.css">
<script src="/pub/signout.js" defer></script>
<script type="module" src="/js/app.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/applications" aria-label="Deploy home">
    <img src="/pub/logo.svg" alt="GOcontroll" height="36">
  </a>
  <span class="divider" aria-hidden="true"></span>
  <a class="crumb" href="https://gocontroll.tools" aria-label="Back to GOcontroll Team" data-icon="arrow-left"><span>Team</span></a>
  <span class="crumb-sep" aria-hidden="true">/</span>
  <a class="app-title" href="#/applications"><span class="long">Deploy</span><span class="short">Deploy</span></a>
  <span class="spacer"></span>
  <span class="who" id="who">
    <span class="avatar" aria-hidden="true" id="who-initials"></span>
    <span class="who-name" id="who-name"></span>
  </span>
  <a class="logout" href="/cdn-cgi/access/logout" data-signout data-icon="logout" aria-label="Sign out"><span>Sign out</span></a>
</header>
<section class="hero">
  <nav class="app-tabs" aria-label="Sections">
    <a href="#/applications" data-tab="applications">Applications</a>
    <a href="#/firmware" data-tab="firmware">Firmware</a>
    <a href="#/images" data-tab="images">Images</a>
    <a href="#/key-generator" data-tab="key-generator">Key generator</a>
  </nav>
  <div class="hero-inner" id="hero"></div>
</section>

<main id="view">
  <div class="loading"><span class="spinner dark"></span> Loading…</div>
</main>

<footer>&copy; GOcontroll B.V.</footer>

<!-- Generic form dialog: content set by ui.js formDialog() -->
<dialog class="modal" id="form-dialog" aria-labelledby="form-dialog-title">
  <form id="form-dialog-form" novalidate autocomplete="off">
    <div class="modal-head">
      <h2 id="form-dialog-title"></h2>
      <button type="button" class="icon-btn" data-close data-icon="x" aria-label="Close"></button>
    </div>
    <div class="modal-body">
      <div id="form-dialog-body" class="dialog-body"></div>
      <div class="notice err" id="form-dialog-error" hidden></div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary" id="form-dialog-submit"></button>
    </div>
  </form>
</dialog>

<!-- A key pair made in this browser (Key generator, or an application's page): key.js
     showKeyPair(). Closes with Close, the x or Escape; before the pair is downloaded or marked as
     stored, closing asks first, because the private key is gone after it. -->
<dialog class="modal" id="keypair-dialog" aria-labelledby="keypair-title">
  <div class="modal-head">
    <h2 id="keypair-title">Store the private key now</h2>
    <button type="button" class="icon-btn" id="keypair-x" data-icon="x" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <div id="keypair-body" class="dialog-body"></div>
    <div class="notice warn" id="keypair-leave" hidden>
      <p><strong>The private key has not been downloaded or marked as stored.</strong> Once this window is closed it is gone: Deploy does not keep it, and nobody can show it again.</p>
      <div class="btn-row">
        <button type="button" class="btn sm" id="keypair-stay">Back to the key pair</button>
        <button type="button" class="btn sm danger" id="keypair-discard">Close without it</button>
      </div>
    </div>
    <div class="notice err" id="keypair-error" hidden></div>
  </div>
  <div class="modal-foot keypair-foot">
    <label class="check"><input type="checkbox" id="keypair-ack"> I have stored the private key (for example in 1Password)</label>
    <button type="button" class="btn" id="keypair-close">Close</button>
    <button type="button" class="btn primary" id="keypair-attach" hidden disabled></button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
