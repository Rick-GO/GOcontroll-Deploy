name = "gocontroll-images"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# The download site for customers: Linux images (the complete image for UUU, rootfs, kernel,
# bootloader, …) for the Moduline L4, M1 and HMI1, from the bucket gocontroll-images. The intranet
# Worker of this repo (gocontroll-deploy-intranet, the Images tab) is the only writer of that
# bucket's releases and manifest.json; this Worker only reads them, and appends the download log.
# The contract between the two: ../src/images-format.ts.
#
# A gocontroll.tech hostname, not the intranet (gocontroll.tools): the people signing in are
# customers, with their e-mail address (a link by mail, src/access.ts), never Entra. No Access
# application: the Worker decides who is signed in itself (src/session.ts). Only reachable via the
# custom domain; workers.dev and preview URLs would be a second address of the site for no reason.
workers_dev = false
preview_urls = false
routes = [{ pattern = "images.gocontroll.tech", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
# Every request goes through the Worker first: the pages only with a session (or the sign-in page),
# the scripts, stylesheet and brand images to anyone (they hold no data).
run_worker_first = true

[observability]
enabled = true

# The images bucket: manifest.json (the published catalogue), images/…, the download log
# downloads/… and the hourly cap on links access-mails/… (layout in ../src/images-format.ts). This
# Worker serves only the files that manifest.json names (never a draft, never the log), writes one
# empty object per download and one per address that asked for a link.
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "gocontroll-images"

# The mail with the link, without the Microsoft 365 secret: the intranet Worker's RPC entrypoint
# ImagesMail (../src/images-mail.ts) mails one fixed message to the address it is given, with a link to
# this site only. A service binding is not reachable from the internet. The intranet Worker must be
# deployed with that entrypoint before this binding.
[[services]]
binding = "MAIL"
service = "gocontroll-deploy-intranet"
entrypoint = "ImagesMail"

# Requests for a link per client IP (src/access.ts): a brake on scripts. namespace_id is an
# account-wide number of our own choosing (Knowledgebase 4711, Configurator 4721–4723); period 10
# or 60 seconds.
[[ratelimits]]
name = "RL_ACCESS"
namespace_id = "4731"
simple = { limit = 5, period = 60 }

# Secrets from the account's Secrets Store default_secrets_store (GOcontroll-Team/CLAUDE.md,
# "Geheimen"); read with ../src/lib/secret.ts. Each must exist before a deploy with its binding.
#
# HMAC key of the links and the session cookies (src/session.ts): base64 of 32 random bytes, made in
# the store by the session on 2026-10-28, never seen by anyone. A new value ends every session and
# every link (customers ask for a new one); nothing else depends on it.
[[secrets_store_secrets]]
binding = "SESSION_KEY"
store_id = "33801ac6937549ae8f6f92169586a707"
secret_name = "IMAGES_SESSION_KEY"

# Turnstile secret key of the widget for images.gocontroll.tech (src/turnstile.ts). Made with the
# placeholder not-set, which means no link can be sent; the owner pastes the widget's secret
# (README, "One-time setup").
[[secrets_store_secrets]]
binding = "TURNSTILE_SECRET"
store_id = "33801ac6937549ae8f6f92169586a707"
secret_name = "IMAGES_TURNSTILE_SECRET"

[vars]
# The site's origin: the links in the mails, the sign-in form's Origin, Turnstile's hostname.
SITE_URL = "https://images.gocontroll.tech"
# Turnstile site key of the widget "GOcontroll Downloads" for images.gocontroll.tech (not a secret; put
# into the sign-in page), made by the owner on 2026-10-28. Empty means every request gets 503 "Downloads
# are being set up" (fail closed): the way to close the site at once.
TURNSTILE_SITE_KEY = "0x4AAAAAAFqCLsOdYdzKqlhv"

[dev]
# Keep request.url on localhost during `wrangler dev` (it would otherwise take the route's host),
# so the DEV_USER_EMAIL bypass of src/session.ts can recognise local runs.
host = "localhost"
